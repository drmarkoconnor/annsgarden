<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#047857" />
    <title>Ann's Garden Planner</title>
    <style>
      body {
        margin: 0;
        background: #f5f5f4;
        color: #1c1917;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        box-sizing: border-box;
        min-height: 100vh;
        padding: 2rem 1rem;
        display: grid;
        place-items: center;
      }

      section {
        max-width: 24rem;
        border: 1px solid #d6d3d1;
        border-radius: 0.5rem;
        background: #fdfcf8;
        padding: 1.25rem;
        box-shadow: 0 1px 2px rgba(68, 64, 60, 0.08);
      }

      h1 {
        margin: 0;
        font-size: 1.5rem;
      }

      p {
        color: #57534e;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>Offline</h1>
        <p>
          Ann's Garden Planner could not reach the garden data. Reconnect and
          try again; any text already open in a form may still be on this device.
        </p>
      </section>
    </main>
  </body>
</html>
